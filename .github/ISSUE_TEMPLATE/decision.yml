name: Decision
description: A question a maintainer must answer before work starts.
type: Task
labels: [needs-decision]
body:
    - type: textarea
      id: question
      attributes:
          label: Question
          description: The one decision to make.
      validations:
          required: true
    - type: textarea
      id: context
      attributes:
          label: Context
          description: Facts, with code links at a commit SHA.
      validations:
          required: true
    - type: textarea
      id: options
      attributes:
          label: Options
          description: Each option with its consequence.
      validations:
          required: true
    - type: textarea
      id: recommendation
      attributes:
          label: Recommendation
          description: The recommended option and why, if there is one.
