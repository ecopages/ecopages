name: CI

on:
    pull_request:
    push:
        branches:
            - main

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    fast:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Get pnpm store directory
              id: pnpm-cache
              shell: bash
              run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm cache
              uses: actions/cache@v6
              with:
                  path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Get Playwright version
              id: playwright-version
              run: echo "VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              uses: actions/cache@v6
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.VERSION }}

            - name: Install Playwright Browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: pnpm exec playwright install chromium --with-deps

            - name: Install Playwright OS deps
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: pnpm exec playwright install-deps chromium

            - name: Fast gate
              run: pnpm run test:ci:fast

    e2e:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Get pnpm store directory
              id: pnpm-cache
              shell: bash
              run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm cache
              uses: actions/cache@v6
              with:
                  path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Get Playwright version
              id: playwright-version
              run: echo "VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              uses: actions/cache@v6
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.VERSION }}

            - name: Install Playwright Browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: pnpm exec playwright install --with-deps

            - name: Install Playwright OS deps
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: pnpm exec playwright install-deps

            - name: E2E (main gate)
              run: pnpm run test:ci:e2e
              env:
                  ECOPAGES_LOGGER_DEBUG: false
                  ECOPAGES_E2E_TIMING: true
