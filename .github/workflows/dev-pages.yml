name: Developer pages

on:
    pull_request:
        types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
    group: dev-pages-${{ github.ref }}
    cancel-in-progress: true

jobs:
    sources:
        name: Developer pages cover changed sources
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'docs-not-needed') }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Check developer pages against the changed files
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: node --experimental-strip-types scripts/check-dev-pages.ts "origin/$BASE_REF"
