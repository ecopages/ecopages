name: Publish

on:
    push:
        branches:
            - main
            # Add the current RC line here, e.g. release/v0.3.0
            - release/v0.2.0
    workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    publish:
        name: Publish
        permissions:
            contents: write
            id-token: write
            pull-requests: write

        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Build npm packages
              run: pnpm run build:npm

            - name: Configure npm for OIDC trusted publishing
              run: npm config delete //registry.npmjs.org/:_authToken --location=user || true

            - name: Create Release Pull Request or Publish
              id: changesets
              uses: changesets/action@v2
              with:
                  github-token: ${{ github.token }}
                  version-script: pnpm changeset version
                  publish-script: pnpm changeset publish
              env:
                  NPM_CONFIG_PROVENANCE: true
