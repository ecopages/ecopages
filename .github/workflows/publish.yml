name: Publish

on:
    push:
        branches:
            - main
            # Drop after 0.2.0 is on main. Later cuts merge develop into main.
            - release/v0.2.0
    workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    publish:
        name: Publish
        permissions:
            contents: write
            id-token: write
            pull-requests: write

        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright Browsers
              run: pnpm exec playwright install --with-deps

            - name: Test
              run: pnpm run test:all
              env:
                  ECOPAGES_BASE_URL: http://localhost:3000
                  ECOPAGES_LOGGER_DEBUG: false

            - name: Configure npm for OIDC trusted publishing
              run: npm config delete //registry.npmjs.org/:_authToken --location=user || true

            - name: Create Release Pull Request or Publish
              id: changesets
              uses: changesets/action@v2
              with:
                  publish-script: pnpm run release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_CONFIG_PROVENANCE: true

            - name: Tag CLI version for official templates
              if: steps.changesets.outputs.published == 'true'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION="$(node -p "require('./packages/ecopages/package.json').version")"
                  TAG="v${VERSION}"
                  if git rev-parse "$TAG" >/dev/null 2>&1; then
                    echo "Tag ${TAG} already exists"
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag "$TAG"
                  git push origin "$TAG"
