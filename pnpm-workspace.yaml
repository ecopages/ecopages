packages:
    - packages/*
    - packages/__internals/*
    - packages/core/__fixtures__/app
    - packages/integrations/*
    - packages/processors/*
    - playground/*
    - e2e/fixtures/*
    - apps/*
    - examples/recipes/*
    - templates/*
    - templates/**/*
    - '!templates/**/dist/**'

# core and @ecopages/testing depend on each other; typecheck scripts still run independently.
ignoreWorkspaceCycles: true

allowBuilds:
    esbuild: true
    sharp: true

minimumReleaseAgeExclude:
    - '@ecopages/*'
    - postcss-nested@8.0.1
