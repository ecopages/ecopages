packages:
    - npm/*
    - packages/*
    - packages/__internals/*
    - packages/core/__fixtures__/app
    - packages/integrations/*
    - packages/loaders/*
    - packages/plugins/*
    - packages/processors/*
    - playground/*
    - e2e/fixtures/*
    - apps/*
    - examples/docs-starter
    - examples/starter-jsx
    - examples/blog-jsx

allowBuilds:
    bun: true
    esbuild: true
    sharp: true

minimumReleaseAgeExclude:
    - '@ecopages/jsx@0.3.0-beta.5'
    - '@ecopages/radiant@0.3.0-beta.5'
    - '@ecopages/signals@0.3.0-beta.5'
    - postcss-nested@8.0.0
    - '@ecopages/radiant-ui@0.1.0-beta.3'
