packages:
    - packages/*
    - packages/__internals/*
    - packages/core/__fixtures__/app
    - packages/integrations/*
    - packages/processors/*
    - playground/*
    - e2e/fixtures/*
    - apps/*
    - templates/*
    - templates/**/*

# core and @ecopages/testing depend on each other; typecheck scripts still run independently.
ignoreWorkspaceCycles: true

allowBuilds:
    esbuild: true
    sharp: true

minimumReleaseAgeExclude:
    - '@ecopages/jsx@0.4.0'
    - '@ecopages/radiant@0.4.0'
    - '@ecopages/signals@0.4.0'
    - postcss-nested@8.0.1
    - '@ecopages/radiant-ui@0.2.1'
    - '@ecopages/radiant-themes@0.2.1'
